<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scannerizza Etichetta - I LOVE SHOPPING</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-orange: #FD991F;
            --brand-gray: #7A8686;
        }
        
        body {
            font-family: 'Inter', sans-serif;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--brand-orange);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': 'var(--brand-orange)',
                        'brand-gray': 'var(--brand-gray)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-brand-gray min-h-screen antialiased overflow-x-hidden relative">

    <div id="perf-timer" class="fixed top-2 left-2 bg-black text-white px-3 py-1 rounded text-xs font-mono shadow-md z-50 hidden">
        Tempo: -- ms
    </div>

    <div class="container mx-auto w-full p-2 md:p-4"> 

        <header class="relative flex items-center justify-center mb-8">
            <h1 class="text-3xl md:text-5xl font-bold text-brand-orange tracking-tight">
                Scannerizza Etichetta
            </h1>

            <a href="https://delnic85.github.io/ILS/magazzino.html" 
               class="absolute right-0 top-1/2 -translate-y-1/2 flex items-center gap-1 text-brand-gray hover:text-brand-orange font-semibold transition-colors duration-200 group">
                <span>Magazzino</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:translate-x-1 transition-transform">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
            </a>
        </header>

        <div class="bg-white rounded-2xl shadow-lg p-4 mb-6">
            <div class="flex flex-col md:flex-row gap-4">
                
                <div class="md:w-1/3 lg:w-1/4">
                    <label for="country-filter" class="sr-only">Filtra per Nazione</label>
                    <div class="relative">
                        <select id="country-filter" 
                                class="w-full p-4 border border-gray-300 rounded-lg text-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent bg-gray-50 appearance-none cursor-pointer font-medium text-gray-700">
                            <option value="-1">Tutti gli stati</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="md:w-2/3 lg:w-3/4">
                    <label for="search-box" class="sr-only">Cerca Tracking</label>
                    <input type="text" id="search-box" 
                           placeholder="Inserisci il tracking..." 
                           class="w-full p-4 border border-gray-300 rounded-lg text-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent">
                </div>

            </div>
        </div>

        <div class="space-y-6">
            <div id="status-message" class="p-8 text-center bg-white rounded-2xl shadow-lg">
                <div class="flex flex-col items-center justify-center space-y-4">
                    <span class="loader"></span>
                    <span class="text-gray-500 font-medium" id="loading-text">Caricamento dati...</span>
                </div>
            </div>

            <div id="main-layout" class="flex flex-col lg:flex-row gap-6 hidden">
                <div id="orders-container" class="flex-1"></div>
                <div id="sidebar-container" class="w-full lg:w-1/4 hidden">
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden sticky top-4">
                        <div class="bg-brand-gray text-white p-3">
                            <h3 class="font-bold text-center uppercase tracking-wider text-sm">Totali in questo Report</h3>
                        </div>
                        <div class="p-4">
                            <table class="w-full text-sm">
                                <thead>
                                    <tr class="border-b border-gray-200">
                                        <th class="text-left py-2 text-brand-orange">SKU GLS</th>
                                        <th class="text-right py-2 text-brand-gray">Venduti</th>
                                    </tr>
                                </thead>
                                <tbody id="sidebar-tbody"></tbody>
                            </table>
                            <p class="text-xs text-gray-400 mt-4 text-center italic">
                                *Somma totale per questi SKU nel report corrente.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- CONFIGURAZIONE SCRIPT MODIFICA (PASSO 1) ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx2-YY947r-OmN2j8ELJULRSQzgY_1Ue-inVu9NQBhnc7KJP1eVhOb4axrmcDwa00U/exec";

        // --- CONFIGURAZIONE DATI ---
        const SHEET_ID_ORDINI = "1Qjj9QhNw4unnUV3t2kNP9j3K-usHzw-MCQ3laUrwqos";
        
        const NOMI_SCHEDE = [
            "GERMANIA", "FRANCIA", "ITALIA", "PAESI BASSI", "SPAGNA", 
            "BELGIO", "AUSTRIA", "REP. CECA", "UNGHERIA", "PORTOGALLO", 
            "DANIMARCA", "POLONIA", "AMAZON", "TIKTOK"
        ];

        const ORDER_SHEET_URLS = NOMI_SCHEDE.map(nome => 
            `https://docs.google.com/spreadsheets/d/${SHEET_ID_ORDINI}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(nome)}`
        );

        const SYNC_PRODOTTI_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQLf2HBC2g4q3L-hER7WPpYixWIIqJyV6MAkWm4ENZlQNrLxbroZRP3HBZ7Uzl510OVON8q590_YH_S/pub?gid=940187269&single=true&output=csv';
        const INVENTORY_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQLf2HBC2g4q3L-hER7WPpYixWIIqJyV6MAkWm4ENZlQNrLxbroZRP3HBZ7Uzl510OVON8q590_YH_S/pub?gid=938359466&single=true&output=csv';

        const MAP_OLD = { ORDER_ID: 0, ITEM_TITLE: 7, SKU: 9, QTY: 11, CLIENT: 14, TRACKING: 33 };
        const MAP_NEW = { ORDER_ID: 0, ITEM_TITLE: 8, SKU: 11, QTY: 13, CLIENT: 17, TRACKING: 36 };
        const MAP_AMAZON = { ORDER_ID: 11, TRACKING: 12, SKU: 14, ITEM_TITLE: 15, QTY: 17, CLIENT: 1 };
        const MAP_TIKTOK = { ORDER_ID: 0, ITEM_TITLE: 7, SKU: 6, QTY: 9, CLIENT: 37, TRACKING: 33 };

        const SYNC_COLS = { ASIN: 0, SKU: 1 };
        const INVENTORY_COLS = { ASIN: 0, F_BRAND: 5, H_QTY_MAG: 7, I_SCAFFALE: 8, AB_IMG_URL: 28 };

        // --- VARIABILI GLOBALI ---
        let searchBox, statusMessage, loadingText, ordersContainer, perfTimer, sidebarContainer, sidebarTbody, mainLayout, countryFilter;
        let allGroupedOrders = [];
        let inventoryDataMap = new Map(); 
        let skuToAsinMap = new Map();     
        let trackingIndex = new Map();
        let skuCountsByReport = [];
        let searchStartTime = 0;

        document.addEventListener('DOMContentLoaded', () => {
            searchBox = document.getElementById('search-box');
            countryFilter = document.getElementById('country-filter');
            statusMessage = document.getElementById('status-message');
            loadingText = document.getElementById('loading-text');
            ordersContainer = document.getElementById('orders-container');
            perfTimer = document.getElementById('perf-timer');
            sidebarContainer = document.getElementById('sidebar-container');
            sidebarTbody = document.getElementById('sidebar-tbody');
            mainLayout = document.getElementById('main-layout');

            NOMI_SCHEDE.forEach((nome, index) => {
                let option = document.createElement('option');
                option.value = index;
                option.textContent = nome;
                countryFilter.appendChild(option);
            });

            searchBox.addEventListener('input', () => { renderOrders(); });
            countryFilter.addEventListener('change', () => { renderOrders(); });

            searchBox.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.keyCode === 13) {
                    event.preventDefault(); 
                    searchStartTime = performance.now(); 
                    searchBox.select(); 
                    renderOrders();
                }
            });

            loadAllData();
        });

        function normalizeTracking(code) {
            if (!code) return "";
            return code.toString().replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
        }

        async function loadAllData() {
            try {
                const [syncRes, invRes] = await Promise.allSettled([
                    fetch(SYNC_PRODOTTI_URL),
                    fetch(INVENTORY_CSV_URL)
                ]);

                if (syncRes.status === 'fulfilled' && syncRes.value.ok) createSkuToAsinMap(await syncRes.value.text());
                if (invRes.status === 'fulfilled' && invRes.value.ok) createInventoryMap(await invRes.value.text());

                const allOrdersMap = new Map();
                let ordersLoadedCount = 0;
                skuCountsByReport = new Array(NOMI_SCHEDE.length).fill(null);

                for (let i = 0; i < NOMI_SCHEDE.length; i++) {
                    const nome = NOMI_SCHEDE[i];
                    loadingText.textContent = `Caricamento ${nome}... (${i+1}/${NOMI_SCHEDE.length})`;
                    
                    try {
                        const response = await fetch(ORDER_SHEET_URLS[i]);
                        if (response.ok) {
                            skuCountsByReport[i] = {}; 
                            try {
                                processOrdersCsv(await response.text(), allOrdersMap, i);
                                ordersLoadedCount++;
                            } catch (parseError) {
                                console.warn(`Errore lettura dati foglio ${nome}:`, parseError);
                            }
                        }
                    } catch (e) { 
                        console.warn(`Errore download foglio ${nome}`); 
                    }
                }

                if (ordersLoadedCount === 0) throw new Error('Nessun dato caricato. Controlla connessione o fogli.');

                allGroupedOrders = Array.from(allOrdersMap.values());
                buildTrackingIndex();
                renderOrders();
                statusMessage.classList.add('hidden');
            } catch (error) {
                console.error(error);
                statusMessage.innerHTML = `<div class="text-red-600 p-4">Errore Critico: ${error.message}</div>`;
            }
        }

        function createSkuToAsinMap(csvText) {
            const lines = csvText.trim().split('\n'); lines.shift(); 
            lines.forEach(line => {
                const cols = parseCSVLine(line);
                if (cols[0] && cols[1]) skuToAsinMap.set(cols[1].trim(), cols[0].trim());
            });
        }

        function createInventoryMap(csvText) {
            const lines = csvText.trim().split('\n'); lines.shift();
            lines.forEach(line => {
                const cols = parseCSVLine(line);
                if (cols[0]) {
                    inventoryDataMap.set(cols[0].trim(), { 
                        imageUrl: cols[INVENTORY_COLS.AB_IMG_URL] || '', 
                        scaffale: cols[INVENTORY_COLS.I_SCAFFALE] || 'N/D', 
                        brand: cols[INVENTORY_COLS.F_BRAND] || 'N/D',
                        qtyMag: cols[INVENTORY_COLS.H_QTY_MAG] || '0'
                    });
                }
            });
        }

        function buildTrackingIndex() {
            trackingIndex.clear();
            allGroupedOrders.forEach(order => {
                if (order.tracking && order.tracking !== 'N/D') {
                    let cleanTrack = normalizeTracking(order.tracking);
                    
                    if (cleanTrack.startsWith('179') && cleanTrack.length === 18) {
                        cleanTrack = cleanTrack.slice(0, -3);
                    } 
                    else if (cleanTrack.startsWith('089')) {
                        if (cleanTrack.length === 18) {
                            cleanTrack = cleanTrack.slice(1, -3);
                        } else if (cleanTrack.length === 15) {
                            cleanTrack = cleanTrack.slice(1);
                        }
                    } 
                    else if (cleanTrack.length > 30) {
                        cleanTrack = cleanTrack.slice(-12);
                    }

                    trackingIndex.set(cleanTrack.toLowerCase(), order);
                }
            });
        }

        function processOrdersCsv(csvText, ordersMap, reportIndex) {
            const lines = csvText.trim().split('\n');
            lines.shift(); 
            let currentReportCounts = skuCountsByReport[reportIndex];
            
            const isAmazon = NOMI_SCHEDE[reportIndex] === "AMAZON";
            const isTiktok = NOMI_SCHEDE[reportIndex] === "TIKTOK";

            lines.forEach(line => {
                try {
                    const cols = parseCSVLine(line);
                    let orderId, sku, qty, cliente, tracking, itemTitle;

                    if (isAmazon) {
                        if (cols.length <= 17) return; 
                        orderId = cols[MAP_AMAZON.ORDER_ID];
                        sku = cols[MAP_AMAZON.SKU] ? cols[MAP_AMAZON.SKU].trim() : 'N/D';
                        qty = parseInt(cols[MAP_AMAZON.QTY]) || 0;
                        cliente = cols[MAP_AMAZON.CLIENT] || 'N/D';
                        tracking = cols[MAP_AMAZON.TRACKING] ? cols[MAP_AMAZON.TRACKING].trim() : 'N/D';
                        itemTitle = cols[MAP_AMAZON.ITEM_TITLE] || 'N/D';
                    } else if (isTiktok) {
                        if (cols.length <= MAP_TIKTOK.TRACKING) return;
                        orderId = cols[MAP_TIKTOK.ORDER_ID];
                        sku = cols[MAP_TIKTOK.SKU] ? cols[MAP_TIKTOK.SKU].trim() : 'N/D';
                        qty = parseInt(cols[MAP_TIKTOK.QTY]) || 0;
                        cliente = cols[MAP_TIKTOK.CLIENT] || 'N/D';
                        tracking = cols[MAP_TIKTOK.TRACKING] ? cols[MAP_TIKTOK.TRACKING].trim() : 'N/D';
                        itemTitle = cols[MAP_TIKTOK.ITEM_TITLE] || 'N/D';
                    } else {
                        if (cols.length < 10) return;

                        let mapping = MAP_OLD;
                        let trackIdx = 33; 

                        for (let i = 33; i <= 38; i++) {
                            if (cols[i]) {
                                let val = cols[i].trim();
                                if (val.length > 5 && !val.includes("€") && !val.includes("zł") && !val.includes(".") && !val.includes(",") && /\d/.test(val)) {
                                    trackIdx = i;
                                    break;
                                }
                            }
                        }

                        if (trackIdx >= 35) {
                            mapping = { ...MAP_NEW, TRACKING: trackIdx };
                        } else if (trackIdx == 34) {
                            mapping = { ...MAP_OLD, TRACKING: trackIdx }; 
                        } else {
                            mapping = { ...MAP_OLD, TRACKING: trackIdx };
                        }

                        if (cols.length <= mapping.TRACKING) return;

                        orderId = cols[mapping.ORDER_ID];
                        if (!orderId) return;

                        sku = cols[mapping.SKU] ? cols[mapping.SKU].trim() : 'N/D';
                        qty = parseInt(cols[mapping.QTY]) || 0;
                        cliente = cols[mapping.CLIENT] || 'N/D';
                        itemTitle = cols[mapping.ITEM_TITLE] || 'N/D';
                        
                        tracking = cols[mapping.TRACKING] ? cols[mapping.TRACKING].trim() : 'N/D';
                        
                        if (tracking !== 'N/D' && !/\d/.test(tracking)) {
                             tracking = cols[mapping.TRACKING + 1] ? cols[mapping.TRACKING + 1].trim() : 'N/D';
                        }
                    }

                    if (!orderId) return;

                    if (sku !== 'N/D') {
                        if (!currentReportCounts[sku]) currentReportCounts[sku] = 0;
                        currentReportCounts[sku] += qty;
                    }

                    const asin = skuToAsinMap.get(sku);
                    let inv = { imageUrl: '', scaffale: 'N/D', brand: 'N/D', qtyMag: 'N/D' };
                    if (asin && inventoryDataMap.has(asin)) {
                        inv = inventoryDataMap.get(asin);
                    }

                    const item = {
                        articolo: itemTitle,
                        sku: sku,
                        asin: asin || 'N/D',
                        qty: qty,
                        imageUrl: inv.imageUrl,
                        scaffale: inv.scaffale,
                        brand: inv.brand,
                        qtyMag: inv.qtyMag 
                    };

                    let normTrack = (tracking !== 'N/D' && tracking !== '') ? normalizeTracking(tracking) : null;
                    let groupKey = normTrack ? normTrack : orderId;

                    if (ordersMap.has(groupKey)) {
                        ordersMap.get(groupKey).items.push(item);
                    } else {
                        ordersMap.set(groupKey, {
                            orderId: orderId,
                            cliente: cliente,
                            tracking: tracking,
                            reportIndex: reportIndex,
                            items: [item]
                        });
                    }
                } catch (rowError) {}
            });
        }

        async function modificaScaffale(asin, currentScaffale, element) {
            if (asin === 'N/D') {
                alert("Impossibile modificare: ASIN mancante per questo articolo.");
                return;
            }

            const conferma = confirm(`ATTENZIONE: Stai per modificare la posizione dello Scaffale nel magazzino centrale.\n\nVuoi procedere?`);
            if (!conferma) return;

            const nuovoScaffale = prompt("Inserisci il NUOVO SCAFFALE per questo prodotto:", currentScaffale);
            
            if (nuovoScaffale !== null && nuovoScaffale.trim() !== "" && nuovoScaffale.trim() !== currentScaffale) {
                const testoOriginale = element.innerText;
                element.innerHTML = `<span class="text-sm font-medium opacity-80">Salvando...</span>`;
                element.classList.add("pointer-events-none");

                try {
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        redirect: 'follow', 
                        body: JSON.stringify({ asin: asin, scaffale: nuovoScaffale.trim().toUpperCase() })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        const newVal = nuovoScaffale.trim().toUpperCase();
                        element.innerText = newVal;
                        
                        if (inventoryDataMap.has(asin)) {
                            inventoryDataMap.get(asin).scaffale = newVal;
                        }
                    } else {
                        throw new Error(result.error || "Errore sconosciuto durante il salvataggio.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("Errore durante il salvataggio.\n\nDettaglio: " + error.message);
                    element.innerText = testoOriginale; 
                } finally {
                    element.classList.remove("pointer-events-none");
                }
            }
        }

        async function modificaQty(asin, currentQty, element) {
            if (asin === 'N/D') {
                alert("Impossibile modificare: ASIN mancante per questo articolo.");
                return;
            }

            const conferma = confirm(`ATTENZIONE: Stai per modificare la QUANTITÀ RESIDUA nel magazzino centrale.\n\nVuoi procedere?`);
            if (!conferma) return;

            const nuovaQty = prompt("Inserisci la NUOVA QUANTITÀ per questo prodotto:", currentQty);
            
            if (nuovaQty !== null && nuovaQty.trim() !== "" && nuovaQty.trim() !== currentQty) {
                const testoOriginale = element.innerText;
                element.innerHTML = `Salvando...`;
                element.classList.add("pointer-events-none");

                try {
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        redirect: 'follow', 
                        body: JSON.stringify({ asin: asin, qtyMag: nuovaQty.trim() }) 
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        const newVal = nuovaQty.trim();
                        element.innerText = "Qty rim: " + newVal;
                        
                        if (inventoryDataMap.has(asin)) {
                            inventoryDataMap.get(asin).qtyMag = newVal;
                        }
                    } else {
                        throw new Error(result.error || "Errore sconosciuto durante il salvataggio.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("Errore durante il salvataggio.\n\nDettaglio: " + error.message);
                    element.innerText = testoOriginale; 
                } finally {
                    element.classList.remove("pointer-events-none");
                }
            }
        }

        function renderOrders() {
            let rawInput = searchBox.value.trim();
            let cleanInput = normalizeTracking(rawInput);
            
            let selectedReportIndex = parseInt(countryFilter.value);

            if (cleanInput.startsWith('179') && cleanInput.length === 18) {
                cleanInput = cleanInput.slice(0, -3);
            } 
            else if (cleanInput.startsWith('089')) {
                if (cleanInput.length === 18) {
                    cleanInput = cleanInput.slice(1, -3);
                } else if (cleanInput.length === 15) {
                    cleanInput = cleanInput.slice(1);
                }
            } 
            else if (cleanInput.length > 30) {
                cleanInput = cleanInput.slice(-12);
            }
            
            let searchTerm = cleanInput.toLowerCase();

            let filteredOrders = [];

            if (trackingIndex.has(searchTerm)) {
                let foundOrder = trackingIndex.get(searchTerm);
                if (selectedReportIndex === -1 || foundOrder.reportIndex === selectedReportIndex) {
                    filteredOrders = [foundOrder];
                }
            } 
            else if (searchTerm.length > 0) {
                filteredOrders = allGroupedOrders.filter(o => {
                    let matchesTracking = o.tracking && normalizeTracking(o.tracking).toLowerCase().includes(searchTerm);
                    let matchesCountry = (selectedReportIndex === -1) || (o.reportIndex === selectedReportIndex);
                    return matchesTracking && matchesCountry;
                });
            }

            ordersContainer.innerHTML = '';
            sidebarTbody.innerHTML = ''; 
            statusMessage.classList.add('hidden');
            mainLayout.classList.add('hidden'); 
            sidebarContainer.classList.add('hidden'); 

            if (filteredOrders.length === 0) {
                if (searchTerm.length > 0) {
                    statusMessage.innerHTML = `<div class="p-8 text-center text-gray-500">Nessun ordine trovato.</div>`;
                    statusMessage.classList.remove('hidden');
                } else if (!document.querySelector('.loader')) {
                    statusMessage.innerHTML = `<div class="p-8 text-center text-gray-500">Inserisci un codice e premi Invio.</div>`;
                    statusMessage.classList.remove('hidden');
                }
                updateTimer();
                return;
            }

            mainLayout.classList.remove('hidden');

            const mainOrder = filteredOrders[0];
            const reportIdx = mainOrder.reportIndex;
            
            if (reportIdx !== undefined && skuCountsByReport[reportIdx]) {
                const reportStats = skuCountsByReport[reportIdx];
                let sidebarHtml = '';
                const uniqueSkusInOrder = new Set(mainOrder.items.map(i => i.sku));

                uniqueSkusInOrder.forEach(sku => {
                    if(sku !== 'N/D') {
                        const totalSold = reportStats[sku] || 0;
                        sidebarHtml += `
                            <tr class="border-b border-gray-100 last:border-0">
                                <td class="py-2 text-brand-orange font-bold text-xs md:text-sm">${sku}</td>
                                <td class="py-2 text-right font-bold text-gray-700 text-lg">${totalSold}</td>
                            </tr>`;
                    }
                });
                sidebarTbody.innerHTML = sidebarHtml;
                sidebarContainer.classList.remove('hidden'); 
            }

            filteredOrders.forEach(order => {
                const orderCard = document.createElement('div');
                orderCard.className = 'bg-white rounded-2xl shadow-lg overflow-hidden mb-6';
                
                const nazioneNome = NOMI_SCHEDE[order.reportIndex] || '';

                const headerHtml = `
                    <div class="bg-brand-gray text-white p-4 md:flex justify-between items-center relative">
                        <div class="absolute top-0 right-0 bg-gray-800 bg-opacity-30 px-3 py-1 text-xs font-bold uppercase rounded-bl-lg">
                            ${nazioneNome}
                        </div>
                        <div class="mt-2 md:mt-0"><p class="text-sm uppercase opacity-80">Cliente</p><p class="text-xl font-bold">${order.cliente}</p></div>
                        <div class="mt-4 md:mt-0 md:text-right pr-6 md:pr-0"><p class="text-sm uppercase opacity-80">Tracking</p><p class="text-xl font-bold text-brand-orange">${order.tracking || 'N/D'}</p></div>
                    </div>
                `;
                const itemCount = order.items.length;
                const isSingleItem = itemCount === 1;
                const gridCols = Math.min(itemCount, 3);
                
                const itemsHtml = order.items.map(item => {
                    const placeholderImg = `https://placehold.co/150x150/FD991F/white?text=${item.sku[0] || '?'}`;
                    const imgBoxClass = isSingleItem ? "w-72 h-72" : "w-40 h-40";
                    const titleClass = isSingleItem ? "text-2xl md:text-3xl mb-6" : "text-base md:text-lg mb-3";
                    const shelfSizeClass = isSingleItem ? "text-6xl" : "text-5xl";
                    
                    return `
                        <div class="bg-white flex flex-col p-4 ${isSingleItem ? 'items-center text-center' : ''}">
                            <p class="font-semibold text-gray-800 line-clamp-2 ${titleClass}" title="${item.articolo}">${item.articolo}</p>
                            <div class="flex items-center ${isSingleItem ? 'justify-center' : 'justify-start'} w-full">
                                <div class="${imgBoxClass} flex-shrink-0 flex items-center justify-center bg-gray-50 rounded-md border border-gray-100 p-1">
                                    <img src="${item.imageUrl || placeholderImg}" alt="Prodotto" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='${placeholderImg}';">
                                </div>
                                <div class="flex flex-col items-start text-left flex-grow ${isSingleItem ? 'ml-8 gap-4' : 'ml-4 gap-2'}">
                                    <p class="text-sm text-brand-orange font-bold break-all">${item.sku}</p>
                                    <div class="flex items-baseline gap-4 mt-1">
                                        <span class="text-gray-600 font-medium text-lg">${item.brand}</span>
                                        <span class="${shelfSizeClass} font-black text-brand-orange leading-none cursor-pointer hover:opacity-70 transition-opacity" title="Clicca per modificare lo Scaffale" onclick="modificaScaffale('${item.asin}', '${item.scaffale}', this)">${item.scaffale}</span>
                                    </div>
                                    <div class="mt-3 flex items-center gap-4">
                                        <div class="w-16 h-16 bg-brand-orange text-white text-3xl font-bold rounded-full flex items-center justify-center shadow-md">${item.qty}</div>
                                        <span class="text-gray-600 font-medium text-lg cursor-pointer hover:opacity-70 transition-opacity" title="Clicca per modificare la quantità" onclick="modificaQty('${item.asin}', '${item.qtyMag}', this)">Qty rim: ${item.qtyMag}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                orderCard.innerHTML = `${headerHtml}<div class="grid bg-brand-gray gap-[2px] border-2 border-brand-gray" style="grid-template-columns: repeat(${gridCols}, minmax(0, 1fr));">${itemsHtml}</div>`;
                ordersContainer.appendChild(orderCard);
            });
            updateTimer();
        }

        function updateTimer() {
            const endTime = performance.now();
            if (searchStartTime > 0) { 
                perfTimer.textContent = `Tempo: ${(endTime - searchStartTime).toFixed(0)} ms`; 
                perfTimer.classList.remove('hidden'); 
            }
        }

        function parseCSVLine(line) {
            const values = []; let inQuote = false; let currentValue = '';
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuote && line[i+1] === '"') { currentValue += '"'; i++; } else { inQuote = !inQuote; }
                } else if (char === ',' && !inQuote) { values.push(currentValue.trim().replace(/^"|"$/g, '')); currentValue = ''; } 
                else { currentValue += char; }
            }
            values.push(currentValue.trim().replace(/^"|"$/g, ''));
            return values;
        }
    </script>
</body>
</html>
